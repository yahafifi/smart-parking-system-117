# Parameters
nc: 2
scale: n

scales:
  n: [0.50, 0.25, 1024]

# Backbone
backbone:
  - [-1, 1, Conv, [64, 3, 2]]          # 0 - P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1 - P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3 - P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4

  - [-1, 1, Conv, [512, 3, 2]]         # 5 - P4/16

  # Added convolutional layer
  - [-1, 1, Conv, [512, 3, 1]]         # 6 - No downsampling

  - [-1, 2, C3k2, [512, True]]        # 7
  - [-1, 1, Conv, [1024, 3, 2]]        # 8 - P5/32
  - [-1, 2, C3k2, [1024, True]]       # 9
  - [-1, 1, SPPF, [1024, 5]]          # 10
  - [-1, 2, C2PSA, [1024]]            # 11

# Head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12
  - [[-1, 7], 1, Concat, [1]]                  # 13 - P4
  - [-1, 2, C3k2, [512, False]]                # 14

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 15
  - [[-1, 4], 1, Concat, [1]]                  # 16 - P3
  - [-1, 2, C3k2, [256, False]]                # 17

  - [-1, 1, Conv, [256, 3, 2]]                 # 18
  - [[-1, 14], 1, Concat, [1]]                 # 19 - P4
  - [-1, 2, C3k2, [512, False]]                # 20

  - [-1, 1, Conv, [512, 3, 2]]                 # 21
  - [[-1, 11], 1, Concat, [1]]                 # 22 - P5
  - [-1, 2, C3k2, [1024, True]]                # 23

  - [[17, 20, 23], 1, Detect, [nc]]            # 24
